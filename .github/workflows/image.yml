name: Build Parallax image
on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - package.json
      - package-lock.json
      - config.parallax.json
      - ecosystem.config.js
      - index.js
      - src/**
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/darkcloudconsulting/aggr-server-parallax:${{ github.sha }}
